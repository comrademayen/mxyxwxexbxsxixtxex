<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            /* Your site's background */
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2071&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            /* Center content */
            color: #e5e7eb; /* Light gray text */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        h1 {
            /* Your site's neon-gold title font */
            font-family: 'Orbitron', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 5px #FFD700, 0 0 15px #FFD700;
            margin: 0;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        p {
            color: #d1d5db; /* Lighter gray */
            max-width: 400px;
            margin-bottom: 2rem;
        }

        a {
            /* Your site's gold button style */
            display: inline-block;
            background-color: #FFD700;
            color: #0a0a0a;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }

        a:hover {
            background-color: #f0c400;
            box-shadow: 0 0 20px rgba(255, 215, 0, 1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Oops! The page you're looking for doesn't exist. It might have been moved, deleted, or you mistyped the URL.</p>
    
    <a href="/">Go Back Home</a>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Lost in Space</title>
    
    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts from your main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles to match your site's fonts */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #2D225A; /* Deep space purple */
            color: #EAE3FC;
            overflow: hidden; /* Prevent scrollbars from animation overflows */
            position: relative;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* --- Starry Background --- */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: #FFF;
            border-radius: 50%;
            animation: twinkle 5s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* --- Astronaut Animation --- */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .astronaut {
            animation: float 6s ease-in-out infinite;
        }

        /* --- Rocket Animation --- */
        @keyframes travel {
            0% { transform: translateX(200%) translateY(200%) rotate(45deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(-200%) translateY(-200%) rotate(45deg); opacity: 0; }
        }
        
        .rocket {
            animation: travel 15s linear infinite;
            animation-delay: 2s;
        }

        /* Button Style */
        .home-button {
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .home-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Starry Background Container -->
    <div class="stars-container" id="stars-container"></div>
    
    <!-- Page Content -->
    <div class="relative w-full h-full flex flex-col items-center justify-center text-center p-4">
        
        <!-- Planet -->
        <div class="absolute top-10 left-10 w-24 h-24 lg:w-32 lg:h-32 opacity-70">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="planetGradient" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" style="stop-color:#87CEEB" />
                        <stop offset="100%" style="stop-color:#4682B4" />
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="50" fill="url(#planetGradient)"/>
                <path d="M 20,20 Q 40,30 60,20 T 100,20" fill="none" stroke="#2E8B57" stroke-width="4" opacity="0.4"/>
                <path d="M 10,50 Q 30,65 50,50 T 90,50" fill="none" stroke="#3CB371" stroke-width="3" opacity="0.6"/>
                <path d="M 15,80 Q 40,70 65,80 T 100,75" fill="none" stroke="#98FB98" stroke-width="2" opacity="0.5"/>
            </svg>
        </div>

        <!-- Moon -->
        <div class="absolute top-16 right-24 w-8 h-8 opacity-80">
             <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="moonGradient">
                        <stop offset="0%" stop-color="#f5f5f5" />
                        <stop offset="100%" stop-color="#b0b0b0" />
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="50" fill="url(#moonGradient)" />
                <circle cx="30" cy="30" r="10" fill="#999" opacity="0.5"/>
                <circle cx="65" cy="60" r="15" fill="#aaa" opacity="0.5"/>
            </svg>
        </div>

        <!-- Rocket -->
        <div class="absolute top-1/2 left-1/2 w-16 h-16 rocket">
            <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.4999 7.5L15 14.3548L7.5 22.5L22.4999 7.5Z" fill="#FFA500"/>
                <path d="M15 1.86264e-06C15 1.86264e-06 26.25 3.75 30 7.5C22.5 11.25 7.5 22.5 7.5 22.5L1.7145e-06 15L15 1.86264e-06Z" fill="#DCDCDC"/>
                <path d="M7.50011 22.5L2.25002 27.75L11.25 27.75L15.0001 30L18.75 27.75L27.75 27.75L22.5001 22.5L7.50011 22.5Z" fill="#FF4500"/>
            </svg>
        </div>

        <div class="flex items-center justify-center space-x-4 md:space-x-8">
            <h1 class="text-8xl md:text-9xl lg:text-[12rem] font-bold text-white font-orbitron tracking-widest">
                404
            </h1>
            
            <!-- Astronaut SVG -->
            <div class="w-24 md:w-32 lg:w-48 astronaut">
                <svg viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Helmet Glass -->
                    <circle cx="55" cy="55" r="30" fill="#483D8B" stroke="#B0A8D1" stroke-width="3"/>
                    <circle cx="55" cy="55" r="30" fill="url(#glassReflection)"/>
                    <!-- Astronaut Body -->
                    <path d="M55 80 C 40 80, 30 90, 30 100 L 80 100 C 80 90, 70 80, 55 80 Z" fill="#EAE3FC"/>
                    <rect x="40" y="70" width="30" height="20" rx="10" fill="#EAE3FC"/>
                    <!-- Arms -->
                    <rect x="20" y="85" width="15" height="10" rx="5" fill="#EAE3FC" transform="rotate(-30, 20, 85)"/>
                    <rect x="75" y="85" width="15" height="10" rx="5" fill="#EAE3FC" transform="rotate(30, 75, 85)"/>
                    <!-- Legs -->
                    <rect x="40" y="95" width="12" height="15" rx="6" fill="#D8D0F0"/>
                    <rect x="58" y="95" width="12" height="15" rx="6" fill="#D8D0F0"/>
                    <!-- Helmet -->
                    <circle cx="55" cy="55" r="35" fill="#EAE3FC" stroke="#B0A8D1" stroke-width="2" stroke-dasharray="5 5"/>
                    <defs>
                        <radialGradient id="glassReflection" cx="0.75" cy="0.25" r="0.7">
                            <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
                            <stop offset="100%" stop-color="white" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                </svg>
            </div>
        </div>

        <p class="text-xl md:text-2xl font-semibold tracking-wider text-white mt-4 uppercase">
            Looks like you are lost in space
        </p>
        
        <a href="/" class="home-button mt-10 px-6 py-3 rounded-full font-semibold uppercase tracking-wider text-white">
            Go Back Home
        </a>

    </div>

    <script>
        // --- Generate Random Stars ---
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('stars-container');
            const numStars = 150; 
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 3 + 4}s`; // Vary duration
                container.appendChild(star);
            }
        });
    </script>

</body>
</html>
